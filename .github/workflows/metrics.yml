name: Metrics
on:
  # Chạy tự động mỗi ngày vào lúc 00:00
  schedule: [{cron: "0 0 * * *"}]
  # Cho phép chạy thủ công từ tab Actions
  workflow_dispatch:
  # Tự động chạy khi có code mới push lên nhánh chính
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # BẮT BUỘC: Bạn phải tạo một Token (PAT) và lưu vào Secrets của Repo
          token: ${{ secrets.METRICS_TOKEN }}

          # Cấu hình cơ bản
          user: Tuoi-SE
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Ho_Chi_Minh
          config_theme: tokyonight
          
          # 1. Plugin Isometric Calendar (Biểu đồ 3D nửa năm)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          # 2. Plugin Ngôn ngữ
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          
          # 3. Plugin Trophies/Achievements (Thành tựu)
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
